name: TokenLens pilot checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests --cov=backend --cov-fail-under=80
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Browser smoke (synthetic only)
        run: |
          python -m uvicorn backend.app:app --host 127.0.0.1 --port 4318 --no-access-log &
          python -c "import urllib.request,time; exec('for i in range(60):\n try:\n  urllib.request.urlopen(\"http://127.0.0.1:4318/api/health\");break\n except OSError: time.sleep(.2)\nelse: raise RuntimeError(\"Server not ready\")')"
          python tests/browser_smoke.py
